services:
  postgres:
    image: postgres:16-alpine
    container_name: true-handshake-db
    environment:
      POSTGRES_USER: truehandshake
      POSTGRES_PASSWORD: truehandshake
      POSTGRES_DB: truehandshake
    ports:
      - "5433:5432"
    volumes:
      - true-handshake-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U truehandshake"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  true-handshake-pgdata:
